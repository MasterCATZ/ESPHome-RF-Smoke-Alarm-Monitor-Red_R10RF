substitutions:
  # Comma separated list of known alarm frame fragments.
  # Add additional discovered codes here, for example: "5ba9ce8a,b12cd34e,cafe1234"
  r10rf_known_codes: "5ba9ce8a,aaaa5ba9ce8a,aaaa5ba9c,aaa96ea7,5554b7538,5555a4563175"
  # Optional hardwired PIR motion sensor
  # Set to GPIO pin number (e.g., "4") or empty to disable
  pir_gpio: "4"
  # PIR off-delay in seconds (motion stays ON this long after PIR goes low)
  pir_off_delay: "5"
  # PIR on-delay in milliseconds (debounce)
  pir_on_delay: "100"
  # Full frame capture mode (logs ALL decoded frames with timestamps)
  # Enable via button in HA, or set to "true" to start capturing on boot
  capture_all_frames: "false"

esphome:
  name: smokealarmrfdetector-c1101
  friendly_name: Smoke Alarm RF Detector
  includes:
    - r10rf_cc1101.h
  libraries:
    - SPI
    - SmartRC-CC1101-Driver-Lib=https://github.com/LSatan/SmartRC-CC1101-Driver-Lib.git
  on_boot:
    priority: 600
    then:
      - lambda: |-
          r10rf_set_known_codes("${r10rf_known_codes}");
          r10rf_setup();
          r10rf_capture_all_enable(${capture_all_frames});

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: arduino

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO

api:

ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Optional fallback access point. Uncomment if desired.
  # ap:
  #   ssid: "Smoke Alarm RF Fallback"
  #   password: !secret fallback_ap_password

captive_portal:

binary_sensor:
  # RF Smoke Alarm (latched until acknowledged)
  - platform: template
    id: r10rf_alarm
    name: "R10RF Smoke Alarm RF"
    device_class: smoke

  # Optional Hardwired PIR Motion Sensor
  - platform: template
    id: pir_motion
    name: "PIR Motion Sensor"
    device_class: motion
    lambda: |-
      return r10rf_pir_is_latched();

  # Combined: Any alarm trigger (RF smoke OR PIR motion)
  - platform: template
    id: any_alarm
    name: "Any Alarm Triggered"
    device_class: safety
    lambda: |-
      return r10rf_alarm_is_latched() || r10rf_pir_is_latched();

  # Capture all frames mode status
  - platform: template
    id: capture_mode_active
    name: "RF Capture All Frames Active"
    device_class: running
    lambda: |-
      return r10rf_capture_all_enabled();

sensor:
  - platform: template
    id: r10rf_rssi
    name: "R10RF CC1101 RSSI"
    unit_of_measurement: "dBm"
    accuracy_decimals: 0

  - platform: template
    id: capture_log_count
    name: "RF Capture Log Entries"
    unit_of_measurement: "frames"
    accuracy_decimals: 0
    lambda: |-
      return r10rf_capture_log_count();

text_sensor:
  - platform: template
    id: r10rf_last_frame
    name: "R10RF Last Matched Frame"

  - platform: template
    id: r10rf_last_raw_frame
    name: "R10RF Last Raw Frame"

  - platform: template
    id: r10rf_last_unknown_frame
    name: "R10RF Last Unknown Frame"

  # Capture log entries (newest first)
  - platform: template
    id: capture_log_0
    name: "RF Capture Log [0] Newest"
  - platform: template
    id: capture_log_1
    name: "RF Capture Log [1]"
  - platform: template
    id: capture_log_2
    name: "RF Capture Log [2]"
  - platform: template
    id: capture_log_3
    name: "RF Capture Log [3]"
  - platform: template
    id: capture_log_4
    name: "RF Capture Log [4]"

light:
  - platform: esp32_rmt_led_strip
    id: r10rf_status_led
    name: "R10RF Status LED"
    pin: GPIO48
    num_leds: 1
    chipset: WS2812
    rgb_order: GRB
    internal: true

button:
  - platform: template
    id: r10rf_acknowledge
    name: "Acknowledge R10RF Alarm"
    icon: mdi:check-circle
    on_press:
      then:
        - lambda: |-
            r10rf_acknowledge_alarm();
            id(r10rf_alarm).publish_state(false);
            auto call = id(r10rf_status_led).turn_on();
            call.set_rgb(0.0, 1.0, 0.0);
            call.set_brightness(0.08);
            call.perform();

  - platform: template
    id: pir_acknowledge
    name: "Acknowledge PIR Motion"
    icon: mdi:motion-sensor-off
    on_press:
      then:
        - lambda: |-
            r10rf_pir_acknowledge();
            id(pir_motion).publish_state(false);

  - platform: template
    id: any_acknowledge
    name: "Acknowledge All Alarms"
    icon: mdi:shield-check
    on_press:
      then:
        - lambda: |-
            r10rf_acknowledge_alarm();
            r10rf_pir_acknowledge();
            id(r10rf_alarm).publish_state(false);
            id(pir_motion).publish_state(false);
            id(any_alarm).publish_state(false);
            auto call = id(r10rf_status_led).turn_on();
            call.set_rgb(0.0, 1.0, 0.0);
            call.set_brightness(0.08);
            call.perform();

  - platform: template
    id: capture_mode_toggle
    name: "Toggle RF Capture All Frames"
    icon: mdi:record-rec
    on_press:
      then:
        - lambda: |-
            bool enabled = !r10rf_capture_all_enabled();
            r10rf_capture_all_enable(enabled);
            id(capture_mode_active).publish_state(enabled);
            ESP_LOGI("main", "Capture all frames: %s", enabled ? "ENABLED" : "DISABLED");

  - platform: template
    id: capture_log_clear
    name: "Clear RF Capture Log"
    icon: mdi:delete-clock
    on_press:
      then:
        - lambda: |-
            r10rf_capture_all_enable(false);
            r10rf_capture_all_enable(true);  // Re-enable to reset log
            id(capture_mode_active).publish_state(true);
            id(capture_log_count).publish_state(0);
            for (int i = 0; i < 5; i++) {
              char id_str[32];
              snprintf(id_str, sizeof(id_str), "capture_log_%d", i);
              auto *ts = App.get_text_sensor(id_str);
              if (ts) ts->publish_state("");
            }

interval:
  - interval: 50ms
    then:
      - lambda: |-
          r10rf_loop();

          id(r10rf_last_raw_frame).publish_state(r10rf_get_last_raw_frame());

          if (r10rf_has_unknown_frame()) {
            id(r10rf_last_unknown_frame).publish_state(r10rf_get_last_unknown_frame());
            r10rf_clear_unknown_frame();
          }

          if (r10rf_has_alarm()) {
            id(r10rf_last_frame).publish_state(r10rf_get_last_frame());
            id(r10rf_rssi).publish_state(r10rf_last_rssi());
            r10rf_clear_alarm();
          }

          // The binary sensors are latched in C++ until the acknowledge button is pressed.
          id(r10rf_alarm).publish_state(r10rf_alarm_is_latched());
          id(pir_motion).publish_state(r10rf_pir_is_latched());
          id(any_alarm).publish_state(r10rf_alarm_is_latched() || r10rf_pir_is_latched());

          // Capture mode status
          id(capture_mode_active).publish_state(r10rf_capture_all_enabled());
          id(capture_log_count).publish_state(r10rf_capture_log_count());

          // Update capture log text sensors (newest first)
          for (int i = 0; i < 5; i++) {
            const char *entry = r10rf_capture_log_get(i);
            char id_str[32];
            snprintf(id_str, sizeof(id_str), "capture_log_%d", i);
            auto *ts = App.get_text_sensor(id_str);
            if (ts) {
              ts->publish_state(entry ? entry : "");
            }
          }

  - interval: 500ms
    then:
      - lambda: |-
          static bool led_flash = false;
          led_flash = !led_flash;

          auto call = id(r10rf_status_led).turn_on();

          if (r10rf_alarm_is_latched()) {
            call.set_rgb(1.0, 0.0, 0.0);
            call.set_brightness(led_flash ? 1.0 : 0.0);
          } else if (r10rf_pir_is_latched()) {
            call.set_rgb(1.0, 0.5, 0.0);
            call.set_brightness(led_flash ? 1.0 : 0.0);
          } else if (r10rf_capture_all_enabled()) {
            call.set_rgb(0.0, 0.0, 1.0);
            call.set_brightness(led_flash ? 1.0 : 0.0);
          } else {
            call.set_rgb(0.0, 1.0, 0.0);
            call.set_brightness(0.08);
          }

          call.perform();